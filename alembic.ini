# Alembic configuration. The database URL is not here: migrations/env.py reads it from the
# application settings (DATABASE_URL, or `.env`), so it is never written to a committed file.

[alembic]
script_location = %(here)s/migrations
# Revision ids are chosen by hand (`make db-revision ID=0002 NAME=...`), so files sort in order.
file_template = %%(rev)s_%%(slug)s
# Migrations are hand-written; `alembic check` / autogenerate are not used to write them.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
