# Local services for development and integration tests. CI starts the same file, so local and CI
# services cannot drift apart.
services:
  kafka:
    # ADR 0002: exact tag, pinned by digest.
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    # Setting any KAFKA_* variable makes the image ignore its built-in defaults, so the whole
    # single-node KRaft configuration is spelled out. It matches the image's default
    # server.properties (which the ADR 0002 spike ran against) except where commented.
    environment:
      CLUSTER_ID: EFOO7VAAQWCAtD57O3TaGg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Clients connect to the address the broker advertises, not to the bootstrap address. An IP,
      # not `localhost`: the port is published on 127.0.0.1 only, and where `localhost` resolves
      # to ::1 first (GitHub's runners) every connection would first be refused there.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Changed: in the named volume instead of /tmp.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Changed: topics exist only if `make topics` declared them (broker/topics.py).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Changed: a consumer group's first assignment starts at once instead of after 3 s.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      # Reachable only from this machine. The controller port stays inside the container.
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Healthy once the broker answers a client request, not just when the JVM is up.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 20s
      retries: 12
      start_period: 30s

  postgres:
    # Exact tag, pinned by digest, like Kafka (ADR 0002).
    image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    environment:
      POSTGRES_USER: event_pipeline
      # A fixed local-development password, not a secret: the port is published on 127.0.0.1 only
      # and the database holds test data. The same value is the default DATABASE_URL (config.py).
      POSTGRES_PASSWORD: event_pipeline_local
      POSTGRES_DB: event_pipeline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # From PostgreSQL 18 the image keeps its data in a version-named directory below
      # /var/lib/postgresql, so the volume is mounted there, not at .../data.
      - postgres-data:/var/lib/postgresql
      # Creates event_pipeline_test on the first start with an empty volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: while the init scripts run, the image's temporary server listens on
      # its Unix socket only, so this passes only once initialisation (event_pipeline_test) is done.
      test: ["CMD-SHELL", "pg_isready -U event_pipeline -d event_pipeline -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  kafka-data:
  postgres-data:
